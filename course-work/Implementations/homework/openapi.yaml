openapi: 3.0.3
info:
  title: FootballForum API
  description: Пълна документация на REST API услугите за Футболния форум. Включва пълен CRUD за отбори, постове и коментари, както и система за харесвания и JWT автентикация.
  version: 1.0.0
servers:
  - url: https://localhost:5001
    description: Локален сървър

security:
  - BearerAuth: []

paths:
  # ==============================
  # USERS (Автентикация)
  # ==============================
  /api/Users/register:
    post:
      summary: Регистрация на нов потребител
      tags: [Users]
      security: [] # Публичен достъп
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { description: 'Успешна регистрация' }
        '400': { description: 'Грешка при валидацията' }

  /api/Users/login:
    post:
      summary: Вход в системата (Логин)
      tags: [Users]
      security: [] # Публичен достъп
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: 'Успешен вход, връща JWT токен' }
        '401': { description: 'Грешно име или парола' }

  # ==============================
  # TEAMS (Пълен CRUD за отбори)
  # ==============================
  /api/Teams:
    get:
      summary: Извличане на всички отбори (Read)
      tags: [Teams]
      security: []
      parameters:
        - { name: p.PageNumber, in: query, schema: { type: integer, default: 1 } }
        - { name: p.PageSize, in: query, schema: { type: integer, default: 10 } }
        - { name: searchTerm, in: query, schema: { type: string } }
      responses:
        '200': { description: 'Списък с отбори' }
    post:
      summary: Създаване на нов отбор (Create)
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamDto' }
      responses:
        '200': { description: 'Отборът е създаден успешно' }
        '401': { description: 'Неоторизиран достъп' }

  /api/Teams/{id}:
    get:
      summary: Извличане на конкретен отбор по ID (Read)
      tags: [Teams]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Данни за отбора' }
        '404': { description: 'Отборът не е намерен' }
    put:
      summary: Редактиране на отбор (Update)
      tags: [Teams]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamDto' }
      responses:
        '200': { description: 'Отборът е обновен' }
        '403': { description: 'Нямате права за редакция' }
    delete:
      summary: Изтриване на отбор (Delete)
      tags: [Teams]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Отборът е изтрит' }
        '403': { description: 'Нямате права за изтриване' }

  # ==============================
  # POSTS (Пълен CRUD за постове)
  # ==============================
  /api/Posts:
    get:
      summary: Извличане на всички постове (Read)
      tags: [Posts]
      security: []
      parameters:
        - { name: p.PageNumber, in: query, schema: { type: integer, default: 1 } }
        - { name: p.PageSize, in: query, schema: { type: integer, default: 10 } }
        - { name: searchTerm, in: query, schema: { type: string } }
      responses:
        '200': { description: 'Списък с всички постове' }

  /api/Posts/team/{teamId}:
    get:
      summary: Извличане на постове за конкретен отбор
      tags: [Posts]
      security: []
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Списък с постове за отбора' }

  /api/Posts/create/{teamId}:
    post:
      summary: Създаване на нов пост (Create)
      tags: [Posts]
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostDto' }
      responses:
        '200': { description: 'Постът е създаден успешно' }

  /api/Posts/{id}:
    get:
      summary: Извличане на конкретен пост по ID (Read)
      tags: [Posts]
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Данни за поста' }
        '404': { description: 'Постът не е намерен' }
    put:
      summary: Редактиране на пост (Update)
      tags: [Posts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostDto' }
      responses:
        '200': { description: 'Постът е обновен' }
        '400': { description: 'Постът не е намерен или не сте собственик' }
    delete:
      summary: Изтриване на пост (Delete)
      tags: [Posts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Постът е изтрит' }

  # ==============================
  # COMMENTS (CRUD за коментари)
  # ==============================
  /api/Comments/create/{postId}:
    post:
      summary: Добавяне на коментар към пост (Create)
      tags: [Comments]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentDto' }
      responses:
        '200': { description: 'Коментарът е добавен' }

  /api/Comments/{id}:
    put:
      summary: Редактиране на коментар (Update)
      tags: [Comments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCommentDto' }
      responses:
        '200': { description: 'Коментарът е обновен' }
        '400': { description: 'Грешка при редакция' }
    delete:
      summary: Изтриване на коментар (Delete)
      tags: [Comments]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 'Коментарът е изтрит' }
        '400': { description: 'Грешка при изтриване' }

  # ==============================
  # LIKES (Харесвания)
  # ==============================
  /api/Likes/like:
    post:
      summary: Харесване на пост
      tags: [Likes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LikeRequestDto' }
      responses:
        '200': { description: 'Постът е харесан' }
        '400': { description: 'Грешка' }

  /api/Likes/unlike:
    post:
      summary: Премахване на харесване от пост
      tags: [Likes]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LikeRequestDto' }
      responses:
        '200': { description: 'Харесването е премахнато' }
        '400': { description: 'Грешка' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Въведете JWT токена тук'

  schemas:
    RegisterRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
    CreateTeamDto:
      type: object
      properties:
        name: { type: string }
        country: { type: string }
    CreatePostDto:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
    CreateCommentDto:
      type: object
      properties:
        content: { type: string }
    LikeRequestDto:
      type: object
      properties:
        postId: { type: integer }
